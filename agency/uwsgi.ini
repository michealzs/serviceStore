[uwsgi]
chdir = /root/serviceStore/agency
module = settings.wsgi:application  
home = /root/serviceStore/agency/storeenv
master = true
processes = 5
socket = /run/uwsgi/agency.sock
chmod-socket = 660
chown-socket = www-data:www-data
vacuum = true
die-on-term = true
logto = /var/log/uwsgi/uwsgi.log

